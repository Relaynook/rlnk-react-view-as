name: Publish to npm registry

# 觸發:push tag `v*` (如 v0.1.2)。也支援手動 workflow_dispatch 給人工重跑用。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 一次只跑一個 publish 避免版本 race。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm --provenance 需要 OIDC token 讓 npm registry 驗簽是 GH Actions 發的
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Publish 到 npmjs.com 官方 registry (公開 package 免費、無認證下載)。
          # 無 scope package (rlnk-react-view-as) 直接 publish,不用 --access flag
          # (unscoped 預設 public)。
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 保險 check:package.json 內版本要跟 tag 對齊 (v0.1.2 → 0.1.2)
      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $TAG_VERSION doesn't match package.json $PKG_VERSION"
            exit 1
          fi
          echo "✓ Version $PKG_VERSION matches tag"

      # 用 npmjs.com 的 automation token (repo secret NPM_TOKEN)。
      # publishConfig.access=public 讓 npm 知道要 publish 為 public,不然
      # scoped package 預設 restricted。
      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
