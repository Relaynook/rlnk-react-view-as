name: Publish to GitHub Package Registry

# 觸發:push tag `v*` (如 v0.1.0)。也支援手動 workflow_dispatch 給人工重跑用。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 一次只跑一個 publish 避免版本 race。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 讓 GITHUB_TOKEN 可以 publish package 到 GH Package Registry
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 註冊 GH Package Registry;always-auth 讓 npm publish 帶認證
          registry-url: 'https://npm.pkg.github.com'
          scope: '@relaynook'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 保險 check:package.json 內版本要跟 tag 對齊 (v0.1.0 → 0.1.0)
      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $TAG_VERSION doesn't match package.json $PKG_VERSION"
            exit 1
          fi
          echo "✓ Version $PKG_VERSION matches tag"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
